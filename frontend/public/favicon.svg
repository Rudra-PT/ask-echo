<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 15" shape-rendering="crispEdges">
  <!-- Headphones (Slate Grey) -->
  <rect x="1" y="3" width="2" height="4" fill="#6A7B8C" />
  <rect x="13" y="3" width="2" height="4" fill="#6A7B8C" />
  <!-- Headphones Green Accents -->
  <rect x="2" y="4" width="1" height="2" fill="#39FF14" />
  <rect x="13" y="4" width="1" height="2" fill="#39FF14" />
  
  <!-- Outer Head (Black/Dark Outline) -->
  <rect x="4" y="0" width="8" height="1" fill="#111111" />
  <rect x="3" y="1" width="1" height="1" fill="#111111" />
  <rect x="12" y="1" width="1" height="1" fill="#111111" />
  <rect x="2" y="2" width="1" height="1" fill="#111111" />
  <rect x="13" y="2" width="1" height="1" fill="#111111" />
  <rect x="1" y="3" width="1" height="1" fill="#111111" />
  <rect x="14" y="3" width="1" height="1" fill="#111111" />
  <rect x="0" y="4" width="1" height="3" fill="#111111" />
  <rect x="15" y="4" width="1" height="3" fill="#111111" />
  <rect x="1" y="7" width="1" height="1" fill="#111111" />
  <rect x="14" y="7" width="1" height="1" fill="#111111" />
  <rect x="2" y="8" width="1" height="1" fill="#111111" />
  <rect x="13" y="8" width="1" height="1" fill="#111111" />
  <rect x="3" y="9" width="1" height="4" fill="#111111" />
  <rect x="12" y="9" width="1" height="4" fill="#111111" />
  <rect x="4" y="13" width="8" height="1" fill="#111111" />

  <!-- Head Base Fill (White / Light Grey) -->
  <rect x="4" y="1" width="8" height="2" fill="#FFFFFF" />
  <rect x="3" y="3" width="10" height="2" fill="#FFFFFF" />
  <rect x="3" y="5" width="2" height="4" fill="#FFFFFF" />
  <rect x="11" y="5" width="2" height="4" fill="#FFFFFF" />
  <rect x="3" y="9" width="10" height="2" fill="#FFFFFF" />
  <rect x="4" y="11" width="8" height="2" fill="#FFFFFF" />
  <rect x="5" y="13" width="6" height="1" fill="#FFFFFF" />

  <!-- Visor Background (Dark Charcoal) -->
  <rect x="5" y="5" width="6" height="4" fill="#1E222B" />

  <!-- Glowing Green Eyes -->
  <rect x="6" y="6" width="1" height="2" fill="#39FF14" />
  <rect x="9" y="6" width="1" height="2" fill="#39FF14" />

  <!-- Mouth/Speaker Grill (Black/Neon Green Accent) -->
  <rect x="6" y="10" width="4" height="1" fill="#111111" />
  <rect x="7" y="11" width="2" height="1" fill="#39FF14" />
</svg>